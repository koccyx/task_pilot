version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: task_pilot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-task_pilot}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-task_pilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: task_pilot-qdrant
    restart: unless-stopped
    profiles:
      - embeddings
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - task_pilot-network

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: task_pilot-telegram-bot:latest
    container_name: task_pilot-telegram-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-true}
      - HEALTHCHECK_PORT=8080
      - QDRANT_URL=http://qdrant:6333
      - RAG_EMBEDDING_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-task_pilot}
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - postgres

  rag-web:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: task_pilot-rag-web:latest
    container_name: task_pilot-rag-web
    restart: unless-stopped
    profiles:
      - embeddings
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - RAG_QDRANT_COLLECTION=internal_documents_bge_m3
      - RAG_WEB_PORT=8090
      - RAG_EMBEDDING_PROVIDER=ollama
      - RAG_EMBEDDING_MODEL=bge-m3
      - RAG_EMBEDDING_BASE_URL=http://host.docker.internal:11434
      - RAG_EMBEDDING_DIMENSION=1024
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-task_pilot}
    command: ["python", "-m", "chat_bot.rag.web"]
    networks:
      - task_pilot-network
    depends_on:
      - postgres
      - qdrant

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: task_pilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - task_pilot-network
    depends_on:
      - telegram-bot

  loki:
    image: grafana/loki:3.3.0
    container_name: task_pilot-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks:
      - task_pilot-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: task_pilot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-task_pilot}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - task_pilot-network
    depends_on:
      - prometheus
      - loki
      - postgres

networks:
  task_pilot-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
