version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: task_pilot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-task_pilot}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-task_pilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: task_pilot-telegram-bot:latest
    container_name: task_pilot-telegram-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-true}
      - HEALTHCHECK_PORT=8080
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - postgres

networks:
  task_pilot-network:
    driver: bridge

volumes:
  postgres_data:
