server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: task_pilot-mcp-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: task_pilot-mcp-server
          service: task_pilot-mcp-server
          __path__: /var/log/app/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            method_name: method_name
            input_params: input_params
            result: result
            duration_ms: duration_ms
            error_type: error_type
            error_message: error_message
            traceback: traceback
            service: service
            component: component

      - labels:
          level:
          logger:
          method_name:
          service:
          component:
          error_type:

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - output:
          source: message
