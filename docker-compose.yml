version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: task_pilot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-task_pilot}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-task_pilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: task_pilot-qdrant
    restart: unless-stopped
    profiles:
      - embeddings
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - task_pilot-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: task_pilot-mcp-server:latest
    container_name: task_pilot-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-true}
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: task_pilot-telegram-bot:latest
    container_name: task_pilot-telegram-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-true}
      - HEALTHCHECK_PORT=8080
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - QDRANT_URL=http://qdrant:6333
      - RAG_EMBEDDING_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-task_pilot}
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - postgres
      - mcp-server

  rag-web:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: task_pilot-rag-web:latest
    container_name: task_pilot-rag-web
    restart: unless-stopped
    profiles:
      - embeddings
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - RAG_QDRANT_COLLECTION=internal_documents_bge_m3
      - RAG_WEB_PORT=8090
      - RAG_EMBEDDING_PROVIDER=ollama
      - RAG_EMBEDDING_MODEL=bge-m3
      - RAG_EMBEDDING_BASE_URL=http://host.docker.internal:11434
      - RAG_EMBEDDING_DIMENSION=1024
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-task_pilot}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["python", "-m", "chat_bot.rag.web"]
    networks:
      - task_pilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - postgres
      - qdrant

networks:
  task_pilot-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
