[project]
name = "task_pilot-mcp-server"
version = "0.1.0"
description = "MCP server for interacting with the Kaiten API"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.3.2",
    "pydantic>=2.11.7",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

